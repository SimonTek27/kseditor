name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.11.1'
  QT_HOST: 'windows'
  QT_TARGET: 'desktop'
  QT_ARCH: 'win64_msvc2022_64'
  QT_MODULES: 'qtquick3d qtmultimedia qtcharts qtwebsockets qtshadertools qt3d'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.Qt6_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: '1.4.341.1'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ env.QT_HOST }}
          target: ${{ env.QT_TARGET }}
          arch: ${{ env.QT_ARCH }}
          modules: ${{ env.QT_MODULES }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            ${{github.workspace}}/external/vcpkg/installed
            ${{github.workspace}}/external/vcpkg/buildtrees
            ${{github.workspace}}/external/vcpkg/packages
            ${{github.workspace}}/external/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('external/vcpkg/installed/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          if (-not (Test-Path "${{github.workspace}}/external/vcpkg/.git")) {
            git clone https://github.com/microsoft/vcpkg.git "${{github.workspace}}/external/vcpkg"
          }
          & "${{github.workspace}}/external/vcpkg/bootstrap-vcpkg.bat"
          & "${{github.workspace}}/external/vcpkg/vcpkg" install `
            eigen3:x64-windows bullet3:x64-windows openvdb:x64-windows `
            cgal:x64-windows libuv:x64-windows opensubdiv:x64-windows `
            --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:QTDIR = "${{ env.Qt6_DIR }}"
          cmake --preset default -DQT6_PATH="${{ env.Qt6_DIR }}"

      - name: Build (kseditor_lib)
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target kseditor_lib --parallel 2

      - name: Build (ksEditor and plugins)
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 2

      - name: Run unit tests
        run: |
          cd ${{github.workspace}}/build
          ctest -C ${{env.BUILD_TYPE}} --output-on-failure

  analyze:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ env.QT_HOST }}
          target: ${{ env.QT_TARGET }}
          arch: ${{ env.QT_ARCH }}
          modules: ${{ env.QT_MODULES }}
          tools: 'tools_ifw, tools_qtcreator'

      - name: Configure CMake (Debug for analysis)
        shell: pwsh
        run: |
          cmake --preset debug

      - name: Build with compile_commands.json
        run: cmake --build ${{github.workspace}}/build --config Debug --parallel 2

      - name: Run clang-tidy (on changed files)
        shell: pwsh
        run: |
          if (Get-Command clang-tidy -ErrorAction SilentlyContinue) {
            Get-ChildItem -Path src -Recurse -Include "*.cpp","*.h" | Select-Object -First 50 | ForEach-Object {
              clang-tidy $_.FullName -p build --quiet 2>&1 | Add-Content analysis-report.txt
            }
          } else {
            Write-Host "clang-tidy not available, skipping"
          }

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: analysis-report.txt
          if-no-files-found: ignore
