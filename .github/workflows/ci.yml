name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.8.0'
  QT_HOST: 'windows'
  QT_TARGET: 'desktop'
  QT_ARCH: 'win64_msvc2022_64'
  QT_MODULES: 'qtquick3d qtmultimedia qtcharts qtwebsockets'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: '1.4.341.1'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ env.QT_HOST }}
          target: ${{ env.QT_TARGET }}
          arch: ${{ env.QT_ARCH }}
          modules: ${{ env.QT_MODULES }}

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{github.workspace}}/external/vcpkg
          cd ${{github.workspace}}/external/vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install eigen3:x64-windows bullet3:x64-windows openvdb:x64-windows cgal:x64-windows libuv:x64-windows opensubdiv:x64-windows 7zip:x64-windows --triplet x64-windows-static

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build `
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
            -DQT6_PATH="${{env.Qt6_DIR}}/.." `
            -DCMAKE_PREFIX_PATH="${{github.workspace}}/external/vcpkg/installed/x64-windows"

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

      - name: Run tests
        run: |
          cd ${{github.workspace}}/build
          ctest -C ${{env.BUILD_TYPE}} --output-on-failure
